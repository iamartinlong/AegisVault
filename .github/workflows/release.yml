name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: publish (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            experimental: false
          - os: ubuntu-22.04
            rid: linux-x64
            experimental: false
          - os: macos-14
            rid: osx-arm64
            experimental: false
          - os: macos-13
            rid: osx-x64
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'

      - name: Use official NuGet feed
        shell: bash
        run: |
          cat > nuget.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF

      - name: Install Linux AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish AOT
        run: >-
          dotnet publish src/AegisVault.App/AegisVault.App.csproj
          -c Release -r ${{ matrix.rid }} -p:PublishAot=true

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          PUBLISH_DIR="src/AegisVault.App/bin/Release/net10.0/${{ matrix.rid }}/publish"
          mkdir -p artifacts
          find "$PUBLISH_DIR" -name '*.pdb' -delete
          cp LICENSE THIRD-PARTY-NOTICES.md "$PUBLISH_DIR/"
          OUT_NAME="AegisVault-${{ matrix.rid }}-${{ github.ref_name }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "artifacts/${OUT_NAME}.zip" "$PUBLISH_DIR"/* > /dev/null
          else
            tar -czf "artifacts/${OUT_NAME}.tar.gz" -C "$PUBLISH_DIR" .
          fi
          shasum -a 256 artifacts/* > "artifacts/SHA256SUMS-${{ matrix.rid }}" || sha256sum artifacts/* > "artifacts/SHA256SUMS-${{ matrix.rid }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AegisVault-${{ matrix.rid }}
          path: artifacts/*

  release:
    name: release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
