name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # CHANGELOG.md is the single source of truth for release notes: a tag
      # without a matching section fails here instead of after four AOT builds.
      - name: Require a CHANGELOG section for this tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if ! grep -qE "^## \[${version}\] " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section - add it before tagging"
            exit 1
          fi
          echo "found CHANGELOG section for ${version}"

  publish:
    name: publish (${{ matrix.rid }})
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            experimental: false
          - os: ubuntu-22.04
            rid: linux-x64
            experimental: false
          - os: macos-14
            rid: osx-arm64
            # Green since the SDK sysroot + dynamic-lookup workaround in
            # AegisVault.App.csproj (run 35426423612; dotnet/runtime#125858).
            experimental: false
          - os: macos-14
            rid: osx-x64
            # macos-13 is EOL; cross-arch AOT from the arm64 host is supported
            # by the SDK (Xcode ships both toolchains) and verified in
            # run 35426423612.
            experimental: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'

      - name: Use official NuGet feed
        shell: bash
        run: |
          cat > nuget.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF

      - name: Install Linux AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Diagnoses the NativeAOT/Swift link failures (dotnet/runtime#125858):
      # shows whether the SDK still ships the Swift compatibility stubs.
      - name: Diagnose macOS Swift shims
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          SDK="$(xcrun --show-sdk-path)"
          TOOLCHAIN="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/macosx"
          echo "xcode: $(xcodebuild -version | tr '\n' ' ')"
          echo "sdk: $SDK"
          echo "--- \$SDK/usr/lib/swift (swift_time/swiftmath entries) ---"
          ls "$SDK/usr/lib/swift" 2>/dev/null | grep -E 'swift_(time|math|errno|signal|stdio|unistd)|swiftsys_time|swift_Builtin_float' || echo "none found in SDK"
          echo "--- host /usr/lib/swift ---"
          ls /usr/lib/swift 2>/dev/null | grep -E 'libswift|\.tbd' | head -20 || echo "none found on host"
          echo "--- toolchain $TOOLCHAIN ---"
          ls "$TOOLCHAIN" 2>/dev/null | head -20 || echo "toolchain dir missing"

      - name: Publish AOT
        run: >-
          dotnet publish src/AegisVault.App/AegisVault.App.csproj
          -c Release -r ${{ matrix.rid }} -p:PublishAot=true

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          PUBLISH_DIR="src/AegisVault.App/bin/Release/net10.0/${{ matrix.rid }}/publish"
          mkdir -p artifacts
          find "$PUBLISH_DIR" -name '*.pdb' -delete
          cp LICENSE THIRD-PARTY-NOTICES.md "$PUBLISH_DIR/"
          OUT_NAME="AegisVault-${{ matrix.rid }}-${{ github.ref_name }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            # REL-1: 7z keeps the paths it is given, so packing "$PUBLISH_DIR"/*
            # nested the whole workspace path (v0.2.0/v0.3.0 zips extracted to
            # src/.../publish/). Use bsdtar with -C, the same idiom as the
            # tar.gz branch, and assert the entries stayed flat.
            tar -a -c -f "$GITHUB_WORKSPACE/artifacts/${OUT_NAME}.zip" -C "$PUBLISH_DIR" .
            if tar -t -f "$GITHUB_WORKSPACE/artifacts/${OUT_NAME}.zip" | grep -q "$PUBLISH_DIR"; then
              echo "::error::${OUT_NAME}.zip still contains the workspace path"
              exit 1
            fi
          else
            tar -czf "artifacts/${OUT_NAME}.tar.gz" -C "$PUBLISH_DIR" .
          fi
          shasum -a 256 artifacts/* > "artifacts/SHA256SUMS-${{ matrix.rid }}" || sha256sum artifacts/* > "artifacts/SHA256SUMS-${{ matrix.rid }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AegisVault-${{ matrix.rid }}
          path: artifacts/*

  release:
    name: release
    needs: publish
    # Only ships when the required platform builds succeeded; experimental
    # platforms may fail without blocking, but an all-red run must not create
    # an empty release.
    if: startsWith(github.ref, 'refs/tags/') && needs.publish.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          if-no-files-found: error

      # Release notes come from CHANGELOG.md (single source of truth) instead of
      # the auto-generated commit list, so the published text matches the repo.
      - name: Extract the release notes for this tag
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          awk -v header="## [${version}]" '
            index($0, header) == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-body.md
          if ! grep -q '[^[:space:]]' release-body.md; then
            echo "::error::no release notes extracted for ${version}"
            exit 1
          fi
          echo "--- release body ---"
          cat release-body.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release-body.md
